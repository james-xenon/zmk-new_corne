#
# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y





# ===============================
# WS2812 hardware support
# ===============================
# IMPORTANT:
# Normal ZMK RGB underglow is disabled in this test.
# The WS2812 widget module should be the only owner of the LED strip.

CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=n

# ===============================
# HID
# ===============================
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# ===============================
# EC11 encoder
# ===============================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ===============================
# Mouse / pointing
# ===============================
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ===============================
# Backlight is left enabled, but we do not use it for blink in this test.
# ===============================
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# ===============================
# Bluetooth power
# ===============================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ===============================
# Debounce
# ===============================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8


# ===============================
# WS2812 Widget module - test mode
# ===============================
CONFIG_WS2812_WIDGET=y

# We do NOT use automatic layer-change indication here.
# Instead, permanent layer toggles call &ws2812_wdg manually through macros.
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n

CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=120
CONFIG_WS2812_WIDGET_INTERVAL_MS=200
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30
CONFIG_WS2812_WIDGET_LAYER_COLOR=0x202020
