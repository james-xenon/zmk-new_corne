CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_ENABLED_ON_START=y

CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n

# Permanent layers:
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_0=6
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_1=7
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_2=11
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_3=-1

# ON = white, OFF = red
CONFIG_WS2812_WIDGET_LAYER_COLOR_ON=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_COLOR_OFF=0xFF0000
CONFIG_WS2812_WIDGET_LAYER_COLOR_MANUAL=0xFFFFFF

CONFIG_WS2812_WIDGET_LAYER_FADE_IN_MS=600
CONFIG_WS2812_WIDGET_LAYER_HOLD_MS=1000
CONFIG_WS2812_WIDGET_LAYER_FADE_OUT_MS=600
CONFIG_WS2812_WIDGET_LAYER_REPEAT_COUNT=1
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY_ON_START=n

# Для теста можно временно поставить 90.
# После проверки вернуть 20.
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_CRITICAL=20

CONFIG_WS2812_WIDGET_BATTERY_REMINDER=y
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_INTERVAL_MS=180000
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_COLOR=0xFF0000
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_REPEAT_COUNT=3

CONFIG_WS2812_WIDGET_BATTERY_FADE_IN_MS=350
CONFIG_WS2812_WIDGET_BATTERY_HOLD_MS=700
CONFIG_WS2812_WIDGET_BATTERY_FADE_OUT_MS=350
CONFIG_WS2812_WIDGET_BATTERY_BLINK_PAUSE_MS=1000
CONFIG_WS2812_WIDGET_BATTERY_COOLDOWN_AFTER_LAYER_MS=15000

CONFIG_WS2812_WIDGET_PAUSE_RGB_UNDERGLOW=y
CONFIG_WS2812_WIDGET_UNDERGLOW_OFF_DELAY_MS=120
CONFIG_WS2812_WIDGET_UNDERGLOW_RESTORE_DELAY_MS=80

CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=n
CONFIG_WS2812_WIDGET_INTERVAL_MS=200
CONFIG_WS2812_WIDGET_FADE_STEP_MS=30

# ВАЖНО: это должно быть выключено. ZMK core больше не патчим.
CONFIG_WS2812_WIDGET_USE_RGB_UNDERGLOW_OVERLAY_API=n
