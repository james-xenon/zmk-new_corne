# ---------------------------------------------------------------------
# Sleep (Энергосбережение)
# ---------------------------------------------------------------------

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# ---------------------------------------------------------------------
# External power / RGB underglow
# ---------------------------------------------------------------------

CONFIG_ZMK_EXT_POWER=y
CONFIG_LED_STRIP=y
CONFIG_WS2812_STRIP=y
CONFIG_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35

# 0 = solid color
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1

CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# ---------------------------------------------------------------------
# Battery reporting
# ---------------------------------------------------------------------

CONFIG_ZMK_BATTERY_REPORTING=y

# ---------------------------------------------------------------------
# WS2812 widget / indicator
# ---------------------------------------------------------------------

CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_ENABLED_ON_START=y

CONFIG_WS2812_WIDGET_USE_RGB_UNDERGLOW_OVERLAY_API=n

# Авто-управление питанием при индикации
CONFIG_WS2812_WIDGET_USE_EXT_POWER=y
CONFIG_WS2812_WIDGET_EXT_POWER_STARTUP_DELAY_MS=100
CONFIG_WS2812_WIDGET_RESTORE_EXT_POWER_OFF=y

# Пауза основной подсветки во время работы индикаторов
CONFIG_WS2812_WIDGET_PAUSE_RGB_UNDERGLOW=y
CONFIG_WS2812_WIDGET_UNDERGLOW_OFF_DELAY_MS=120
CONFIG_WS2812_WIDGET_UNDERGLOW_RESTORE_DELAY_MS=80

CONFIG_WS2812_WIDGET_INTERVAL_MS=200
CONFIG_WS2812_WIDGET_FADE_STEP_MS=30

# ---------------------------------------------------------------------
# Permanent layer indication
# ---------------------------------------------------------------------

CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n

# Permanent layers: 6 (nav2), 7 (gaming1), 11 (speedtype)
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_0=6
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_1=7
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_2=11
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_3=-1

CONFIG_WS2812_WIDGET_LAYER_COLOR_ON=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_COLOR_OFF=0xFF0000
CONFIG_WS2812_WIDGET_LAYER_COLOR_MANUAL=0xFFFFFF

CONFIG_WS2812_WIDGET_LAYER_FADE_ENABLE=y
CONFIG_WS2812_WIDGET_LAYER_FADE_STEPS=20

CONFIG_WS2812_WIDGET_LAYER_FADE_IN_MS=600
CONFIG_WS2812_WIDGET_LAYER_HOLD_MS=1000
CONFIG_WS2812_WIDGET_LAYER_FADE_OUT_MS=600

CONFIG_WS2812_WIDGET_LAYER_REPEAT_COUNT=1
CONFIG_WS2812_WIDGET_LAYER_BLINK_REPEAT=1
CONFIG_WS2812_WIDGET_LAYER_BLINK_PAUSE_MS=1000
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

# ---------------------------------------------------------------------
# Battery indication
# ---------------------------------------------------------------------

CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY_ON_START=n

CONFIG_WS2812_WIDGET_BATTERY_LEVEL_HIGH=80
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_LOW=20
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_CRITICAL=20

CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x00FF00
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0xFFFF00
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0xFF8000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0xFF0000

CONFIG_WS2812_WIDGET_BATTERY_REMINDER=y
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_ONLY_CRITICAL=n
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_INTERVAL_MS=60000
CONFIG_WS2812_WIDGET_BATTERY_PERIODIC_MS=60000

CONFIG_WS2812_WIDGET_BATTERY_REMINDER_COLOR=0xFF0000
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_REPEAT_COUNT=3
CONFIG_WS2812_WIDGET_BATTERY_BLINK_REPEAT=3
CONFIG_WS2812_WIDGET_BATTERY_CRITICAL_REPEAT_COUNT=3

CONFIG_WS2812_WIDGET_BATTERY_FADE_IN_MS=350
CONFIG_WS2812_WIDGET_BATTERY_HOLD_MS=700
CONFIG_WS2812_WIDGET_BATTERY_FADE_OUT_MS=350
CONFIG_WS2812_WIDGET_BATTERY_BLINK_PAUSE_MS=1000

CONFIG_WS2812_WIDGET_BATTERY_COOLDOWN_AFTER_LAYER_MS=15000

# ---------------------------------------------------------------------
# Connectivity indication
# ---------------------------------------------------------------------

CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=y
CONFIG_WS2812_WIDGET_CONN_SHOW_USB=n

CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150
CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x00FF00
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x0000FF
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x00FFFF
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0xFF0000

# ---------------------------------------------------------------------
# EC11 Encoder
# ---------------------------------------------------------------------

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ---------------------------------------------------------------------
# Mouse & Backlight
# ---------------------------------------------------------------------

CONFIG_ZMK_MOUSE=y
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# ---------------------------------------------------------------------
# Split & Wireless Sync (Синхронизация между половинами)
# ---------------------------------------------------------------------

CONFIG_ZMK_HID_INDICATORS=y

# === Базовые зависимости индикации ===
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_ZMK_SPLIT_PERIPHERAL_HID_INDICATORS=y

# === Настройки WS2812 Подсветки / Виджета ===
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=y

# === Экономия памяти (Flash / RAM Overflow Fix) ===
CONFIG_LOG=n
CONFIG_ZMK_USB_LOGGING=n
CONFIG_SIZE_OPTIMIZATIONS=y

# === ZMK Studio ===
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n