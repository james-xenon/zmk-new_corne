# Sleep
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# WS2812 / RGB underglow
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y

# ВАЖНО:
# Отключаем zmk-ws2812-driver widget, чтобы он не перебивал обычную подсветку.
# Именно он даёт фиолетовый цвет слоя и может конфликтовать с &rgb_ug.
CONFIG_WS2812_WIDGET=n
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=n
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n
CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=n
CONFIG_WS2812_WIDGET_CONN_SHOW_USB=n
CONFIG_WS2812_WIDGET_SHOW_BATTERY=n

# RGB underglow startup state
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# Белый спокойный стартовый цвет:
# Hue не важен при SAT=0, потому что это белый/серый.
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=35

# Без swirl / spectrum / breathe.
# 0 = Solid color.
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1

# Чтобы не жарило и не вызывало лишний ток/мерцание.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

# Автовыключение в idle оставляем.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Не выключать RGB только из-за отсутствия USB,
# потому что у тебя беспроводной split.
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n

# EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_MOUSE=y

# Backlight
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# Uncomment the following line to enable NKRO
#CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Uncomment the following line to increase the keyboard's wireless range
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
