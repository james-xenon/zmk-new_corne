# ---------------------------------------------------------------------
# Sleep
# ---------------------------------------------------------------------
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
CONFIG_ZMK_PM_SOFT_OFF=y

# ---------------------------------------------------------------------
# BLE — усиленный сигнал, стабильная связь между половинами
# ---------------------------------------------------------------------
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ---------------------------------------------------------------------
# RGB underglow
# ---------------------------------------------------------------------
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_SPD_START=1
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MIN=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=10

# ---------------------------------------------------------------------
# Battery
# ---------------------------------------------------------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# ---------------------------------------------------------------------
# WS2812 widget — индикация через светодиоды
# ---------------------------------------------------------------------
CONFIG_WS2812_WIDGET=y
CONFIG_WS2812_WIDGET_ENABLED_ON_START=y
CONFIG_WS2812_WIDGET_USE_EXT_POWER=y
CONFIG_WS2812_WIDGET_EXT_POWER_STARTUP_DELAY_MS=20
CONFIG_WS2812_WIDGET_RESTORE_EXT_POWER_OFF=y
CONFIG_WS2812_WIDGET_PAUSE_RGB_UNDERGLOW=y
CONFIG_WS2812_WIDGET_UNDERGLOW_OFF_DELAY_MS=100
CONFIG_WS2812_WIDGET_UNDERGLOW_RESTORE_DELAY_MS=100
CONFIG_WS2812_WIDGET_INTERVAL_MS=50
CONFIG_WS2812_WIDGET_FADE_STEP_MS=10

# Layer indication
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_0=6
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_1=7
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_2=11
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_3=-1
CONFIG_WS2812_WIDGET_LAYER_COLOR_ON=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_COLOR_OFF=0xFF0000
# Красный для ручной индикации (вход/выход из слоя 13)
CONFIG_WS2812_WIDGET_LAYER_COLOR_MANUAL=0xFF0000
CONFIG_WS2812_WIDGET_LAYER_FADE_IN_MS=250
CONFIG_WS2812_WIDGET_LAYER_HOLD_MS=500
CONFIG_WS2812_WIDGET_LAYER_FADE_OUT_MS=250
CONFIG_WS2812_WIDGET_LAYER_REPEAT_COUNT=1
CONFIG_WS2812_WIDGET_LAYER_BLINK_PAUSE_MS=500
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=20

# Battery indication — 5 уровней цвета
CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_SHOW_BATTERY_ON_START=n
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_FULL=90
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_HIGH=60
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_LOW=30
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_CRITICAL=15
CONFIG_WS2812_WIDGET_BATTERY_COLOR_FULL=0x00FFFF
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x00FF00
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0xFFFF00
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0xFF8000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0xFF0000
CONFIG_WS2812_WIDGET_BATTERY_REMINDER=y
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_ONLY_CRITICAL=y
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_INTERVAL_MS=60000
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_COLOR=0xFF0000
CONFIG_WS2812_WIDGET_BATTERY_REMINDER_REPEAT_COUNT=3
CONFIG_WS2812_WIDGET_BATTERY_BLINK_REPEAT=1
CONFIG_WS2812_WIDGET_BATTERY_CRITICAL_REPEAT_COUNT=3
CONFIG_WS2812_WIDGET_BATTERY_FADE_IN_MS=250
CONFIG_WS2812_WIDGET_BATTERY_HOLD_MS=500
CONFIG_WS2812_WIDGET_BATTERY_FADE_OUT_MS=250
CONFIG_WS2812_WIDGET_BATTERY_BLINK_PAUSE_MS=500
CONFIG_WS2812_WIDGET_BATTERY_COOLDOWN_AFTER_LAYER_MS=15000
CONFIG_WS2812_WIDGET_BATTERY_BOTH_SEPARATOR_MS=500
CONFIG_WS2812_WIDGET_BATTERY_BOTH_LEFT_REPEAT=1
CONFIG_WS2812_WIDGET_BATTERY_BOTH_RIGHT_REPEAT=1


# ---------------------------------------------------------------------
# Mouse / pointing
# ---------------------------------------------------------------------
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ---------------------------------------------------------------------
# Backlight
# ---------------------------------------------------------------------
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# ---------------------------------------------------------------------
# Debounce
# ---------------------------------------------------------------------
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ---------------------------------------------------------------------
# HID
# ---------------------------------------------------------------------
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Исключаем слои 2 и 3 из layer sync (они используют persistent color)
# Бит 2 = 0x4, бит 3 = 0x8 → убираем оба: 0xFFFFFFFE & ~0xC = 0xFFFFFFF3
CONFIG_WS2812_WIDGET_LAYER_INDICATOR_MASK=0xFFFFFFF3

# Сброс до Слоя 0 (зеленый цвет)
CONFIG_WS2812_WIDGET_LAYER_COLOR_MANUAL=0x00FF00