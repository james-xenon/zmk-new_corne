#
# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y





CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y

CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# Uncomment the following line to enable NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Uncomment the following line to increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8


# ===============================
# WS2812 Widget module test
# ===============================
# External module: gohanda11/zmk-ws2812-driver
# It is intended for WS2812 status indication: battery, connection, layer changes.
# The module README says it needs CONFIG_WS2812_WIDGET, LED_STRIP, WS2812_STRIP and SPI.
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_WIDGET=y

# Layer indication.
# SHOW_LAYER_CHANGE = blink/indicate layer changes.
# SHOW_LAYER_COLORS = persistent per-layer color mode.
# For first test, use blinking, not persistent colors.
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=120
CONFIG_WS2812_WIDGET_LAYER_COLOR=0x202020

# Battery indication colors, deliberately dim.
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=200
CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x002000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0x202000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0x200000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0x400000

# Connectivity indication colors, deliberately dim.
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150
CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x002000
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x000020
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x202000
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0x200000
