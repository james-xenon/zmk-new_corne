# WS2812 widget module test
CONFIG_LED_STRIP=y
CONFIG_SPI=y
CONFIG_WS2812_WIDGET=y

# Layer indication
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=100
CONFIG_WS2812_WIDGET_LAYER_COLOR=0x202020

# Battery / connection indication
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=200
CONFIG_WS2812_WIDGET_CONN_BLINK_MS=150

CONFIG_WS2812_WIDGET_BATTERY_COLOR_HIGH=0x002000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_MEDIUM=0x202000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_LOW=0x200000
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0x400000

CONFIG_WS2812_WIDGET_CONN_COLOR_USB=0x002000
CONFIG_WS2812_WIDGET_CONN_COLOR_CONNECTED=0x000020
CONFIG_WS2812_WIDGET_CONN_COLOR_ADVERTISING=0x202000
CONFIG_WS2812_WIDGET_CONN_COLOR_DISCONNECTED=0x200000
