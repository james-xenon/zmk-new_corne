#
# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y





# ===============================
# WS2812 hardware support
# ===============================
# Test mode:
# normal ZMK RGB underglow is disabled.
# zmk-ws2812-driver is the only owner of WS2812 led_strip.

CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=n

# ===============================
# HID
# ===============================
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# ===============================
# EC11 encoder
# ===============================
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ===============================
# Mouse / pointing
# ===============================
CONFIG_ZMK_POINTING=y

# Temporarily disabled because right half cannot satisfy this dependency.
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# ===============================
# Backlight
# ===============================
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100

# ===============================
# Bluetooth power
# ===============================
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# ===============================
# Debounce
# ===============================
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8


# ===============================
# WS2812 Widget module - test mode
# ===============================
CONFIG_WS2812_WIDGET=y

# IMPORTANT:
# Must be enabled, otherwise CONFIG_WS2812_WIDGET_LAYER_0_COLOR ...
# CONFIG_WS2812_WIDGET_LAYER_6_COLOR are not generated by Kconfig,
# but the module source still uses them.
CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y

# Persistent layer colors mode stays disabled.
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n

CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=120
CONFIG_WS2812_WIDGET_INTERVAL_MS=200
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

# Global layer-change color.
CONFIG_WS2812_WIDGET_LAYER_COLOR=0x202020

# Dim layer colors.
# Layer 0 = off.
# Layer 1 = dim red.
# Layer 2 = dim green.
# Layer 3 = dim yellow.
# Layer 4 = dim blue.
# Layer 5 = dim magenta.
# Layer 6 = dim cyan.
# Layers above 6 are handled by module fallback and become white.
CONFIG_WS2812_WIDGET_LAYER_0_COLOR=0x000000
CONFIG_WS2812_WIDGET_LAYER_1_COLOR=0x200000
CONFIG_WS2812_WIDGET_LAYER_2_COLOR=0x002000
CONFIG_WS2812_WIDGET_LAYER_3_COLOR=0x202000
CONFIG_WS2812_WIDGET_LAYER_4_COLOR=0x000020
CONFIG_WS2812_WIDGET_LAYER_5_COLOR=0x200020
CONFIG_WS2812_WIDGET_LAYER_6_COLOR=0x002020
