#
# go to sleep after one hour (1*60*60*1000ms)

CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

CONFIG_ZMK_SLEEP=y





CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y
CONFIG_SPI=y

CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y

CONFIG_ZMK_EXT_POWER=y
CONFIG_ZMK_BATTERY_REPORTING=y

# Uncomment the following line to enable NKRO
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Some operating systems have problems with full support for consumer keycodes.
# Uncomment the following line if keycodes labeled "consumer" like C_AC_SEARCH don't work
#CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

#EC11 enable
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Mouse enable
CONFIG_ZMK_POINTING=y

CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=8
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=8


# ===============================
# Patched WS2812 widget
# ===============================
CONFIG_WS2812_WIDGET=y

# Manual toggle starts enabled after reboot.
# Service + F will toggle it until next reboot.
CONFIG_WS2812_WIDGET_ENABLED_ON_START=y

# Stop WS2812 indication after 20 minutes of keyboard inactivity.
# Any key press / sensor movement re-allows indication unless manually disabled.
CONFIG_WS2812_WIDGET_AUTO_DISABLE_AFTER_INACTIVITY=y
CONFIG_WS2812_WIDGET_INACTIVITY_DISABLE_MS=1200000

CONFIG_WS2812_WIDGET_USE_EXT_POWER=y
CONFIG_WS2812_WIDGET_EXT_POWER_STARTUP_DELAY_MS=100
CONFIG_WS2812_WIDGET_RESTORE_EXT_POWER_OFF=y

# When RGB underglow is already on, pause it before WS2812 indication and restore it after.
CONFIG_WS2812_WIDGET_PAUSE_RGB_UNDERGLOW=y
CONFIG_WS2812_WIDGET_UNDERGLOW_OFF_DELAY_MS=120
CONFIG_WS2812_WIDGET_UNDERGLOW_RESTORE_DELAY_MS=80

CONFIG_WS2812_WIDGET_SHOW_LAYER_CHANGE=y
CONFIG_WS2812_WIDGET_SHOW_LAYER_COLORS=n

# Permanent layers:
# 6  = nav2 permanent
# 7  = gaming1
# 11 = speedtype
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_0=6
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_1=7
CONFIG_WS2812_WIDGET_LAYER_TRIGGER_2=11

CONFIG_WS2812_WIDGET_LAYER_COLOR_ON=0xFFFFFF
CONFIG_WS2812_WIDGET_LAYER_COLOR_OFF=0xFF0000
CONFIG_WS2812_WIDGET_LAYER_COLOR_MANUAL=0xFFFFFF

# Smooth layer indication: one long smooth blink.
CONFIG_WS2812_WIDGET_LAYER_FADE_ENABLE=y
CONFIG_WS2812_WIDGET_LAYER_FADE_STEPS=10
CONFIG_WS2812_WIDGET_LAYER_BLINK_MS=1000
CONFIG_WS2812_WIDGET_LAYER_BLINK_REPEAT=1
CONFIG_WS2812_WIDGET_LAYER_BLINK_PAUSE_MS=1000
CONFIG_WS2812_WIDGET_LAYER_DEBOUNCE_MS=30

# Prevent battery warning from mixing with layer indication.
CONFIG_WS2812_WIDGET_BATTERY_COOLDOWN_AFTER_LAYER_MS=15000

# Battery test threshold: 90%.
# Later change this to 20.
CONFIG_WS2812_WIDGET_SHOW_BATTERY=y
CONFIG_WS2812_WIDGET_BATTERY_LEVEL_CRITICAL=90
CONFIG_WS2812_WIDGET_BATTERY_COLOR_CRITICAL=0xFF0000

# Battery indication: 3 short blinks, 1 second pause between blinks, every 3 minutes.
CONFIG_WS2812_WIDGET_BATTERY_BLINK_MS=180
CONFIG_WS2812_WIDGET_BATTERY_BLINK_REPEAT=3
CONFIG_WS2812_WIDGET_BATTERY_BLINK_PAUSE_MS=1000
CONFIG_WS2812_WIDGET_BATTERY_PERIODIC_MS=180000

CONFIG_WS2812_WIDGET_INTERVAL_MS=180

CONFIG_WS2812_WIDGET_SHOW_CONNECTIVITY=n
