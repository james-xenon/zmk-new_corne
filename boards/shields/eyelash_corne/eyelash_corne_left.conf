# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# Аппаратный энкодер QDEC (заменяет софтверный EC11)
CONFIG_QDEC_NRFX=y

# ZMK Studio (центральная сторона)
CONFIG_ZMK_STUDIO=y

# Split настройки центральной стороны
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y