# EXT POWER
CONFIG_ZMK_EXT_POWER=y

# Аппаратный энкодер QDEC (заменяет софтверный EC11)
CONFIG_QDEC_NRFX=y

# ZMK Studio (центральная сторона)
CONFIG_ZMK_STUDIO=y

# Split настройки центральной стороны
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=1024
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# USB Logging для отладки энкодера
# Логирование через USB CDC
CONFIG_LOG=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
