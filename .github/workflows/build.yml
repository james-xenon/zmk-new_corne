name: Build ZMK firmware (RGB16)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "keymap-drawer/**"
      - "docs/**"

jobs:
  matrix:
    runs-on: ubuntu-22.04
    name: Fetch Build Keyboards
    outputs:
      build_matrix: ${{ env.build_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Build Matrix
        run: |
          echo "build_matrix=$(yq -oj -I0 'build.yaml')" >> "$GITHUB_ENV"
          yq -oj "build.yaml"

  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    name: Build
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.build_matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create build directory
        run: |
          echo "build_dir=$(mktemp -d)" >> "$GITHUB_ENV"

      - name: Prepare variables
        shell: sh -x {0}
        env:
          board: ${{ matrix.board }}
          shield: ${{ matrix.shield }}
          artifact_name: ${{ matrix.artifact-name }}
          snippet: ${{ matrix.snippet }}
        run: |
          if [ -e zephyr/module.yml ]; then
            export zmk_load_arg=" -DZMK_EXTRA_MODULES='${GITHUB_WORKSPACE}'"
            new_tmp_dir="${TMPDIR:-/tmp}/zmk-config"
            mkdir -p "${new_tmp_dir}"
            echo "base_dir=${new_tmp_dir}" >> "$GITHUB_ENV"
          else
            echo "base_dir=${GITHUB_WORKSPACE}" >> "$GITHUB_ENV"
          fi

          if [ -n "${snippet}" ]; then
            extra_west_args="-S \"${snippet}\""
          fi

          echo "zephyr_version=${ZEPHYR_VERSION}" >> "$GITHUB_ENV"
          echo "extra_west_args=${extra_west_args}" >> "$GITHUB_ENV"
          echo "extra_cmake_args=${shield:+-DSHIELD=\"$shield\"}${zmk_load_arg}" >> "$GITHUB_ENV"
          echo "display_name=${shield:+$shield - }${board}" >> "$GITHUB_ENV"
          echo "artifact_name=${artifact_name:-${shield:+$shield-}${board}-zmk}" >> "$GITHUB_ENV"

      - name: Copy config files to isolated temporary directory
        run: |
          if [ "${{ env.base_dir }}" != "${GITHUB_WORKSPACE}" ]; then
            mkdir -p "${{ env.base_dir }}/config"
            cp -R config/* "${{ env.base_dir }}/config/"
          fi

      - name: Cache west modules
        uses: actions/cache@v4
        continue-on-error: true
        env:
          cache_name: cache-zephyr-${{ env.zephyr_version }}-modules-rgb16
        with:
          path: |
            ${{ env.base_dir }}/modules/
            ${{ env.base_dir }}/tools/
            ${{ env.base_dir }}/zephyr/
            ${{ env.base_dir }}/bootloader/
            ${{ env.base_dir }}/zmk/
          key: ${{ runner.os }}-build-${{ env.cache_name }}-${{ hashFiles('**/west.yml', '**/build.yaml', '**/*.conf', 'patches/rgb_underglow.c', 'patches/patch_qdec_sample_fifo.py', 'patches/patch_zmk_sensor_fifo.py', 'patches/patch_firmware_power.py') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache_name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: Restore cached dependency sources before West Update
        shell: sh -e {0}
        run: |
          set -eu
          zephyr_dir="${{ env.base_dir }}/zephyr"
          zmk_dir="${{ env.base_dir }}/zmk"

          if git -C "$zephyr_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            for relative_path in \
              dts/bindings/sensor/nordic,nrf-qdec.yaml \
              drivers/sensor/qdec_nrfx/qdec_nrfx.c; do
              if git -C "$zephyr_dir" ls-files --error-unmatch "$relative_path" >/dev/null 2>&1; then
                git -C "$zephyr_dir" restore --source=HEAD -- "$relative_path"
              fi
            done
          fi

          if git -C "$zmk_dir" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            git -C "$zmk_dir" restore --source=HEAD -- app/src/sensors.c app/src/battery.c
          fi

      - name: West Init
        working-directory: ${{ env.base_dir }}
        run: west init -l "${{ env.base_dir }}/config"

      - name: West Update
        working-directory: ${{ env.base_dir }}
        run: west update --fetch-opt=--filter=tree:0

      - name: Apply QDEC per-sample FIFO fix (left half only)
        if: ${{ contains(matrix.shield, 'eyelash_corne_left') }}
        shell: sh -e {0}
        run: |
          set -eu
          zephyr_dir="${{ env.base_dir }}/zephyr"
          zmk_dir="${{ env.base_dir }}/zmk"
          driver_file="$zephyr_dir/drivers/sensor/qdec_nrfx/qdec_nrfx.c"
          zmk_sensors="$zmk_dir/app/src/sensors.c"

          test -f "${GITHUB_WORKSPACE}/patches/patch_qdec_sample_fifo.py"
          test -f "${GITHUB_WORKSPACE}/patches/patch_zmk_sensor_fifo.py"
          test -f "$driver_file"
          test -f "$zmk_sensors"

          # Preserve the user's per-sample encoder fix, but only in the left build
          # where the physical encoder exists.
          git -C "$zephyr_dir" restore --source=HEAD -- drivers/sensor/qdec_nrfx/qdec_nrfx.c
          git -C "$zmk_dir" restore --source=HEAD -- app/src/sensors.c

          python3 "${GITHUB_WORKSPACE}/patches/patch_qdec_sample_fifo.py" "$zephyr_dir"
          python3 "${GITHUB_WORKSPACE}/patches/patch_zmk_sensor_fifo.py" "$zmk_dir"

          grep -Fq 'QDEC_SAMPLE_FIFO_PATCH_V1' "$driver_file"
          grep -Fq '.sample_inten = true,' "$driver_file"
          grep -Fq '.reportper_inten = false,' "$driver_file"
          grep -Fq 'ZMK_SENSOR_TRIGGER_FIFO_PATCH_V1' "$zmk_sensors"
          grep -Fq 'k_msgq_put(&pending_sensor_indices, &queued_index, K_NO_WAIT)' "$zmk_sensors"
          echo "Left-half QDEC per-sample FIFO patch verified."

      - name: Apply RGB16 underglow patch
        shell: sh -e {0}
        run: |
          set -eu

          test -f "${GITHUB_WORKSPACE}/patches/rgb_underglow.c"
          test -f "${{ env.base_dir }}/zmk/app/src/rgb_underglow.c"

          cp "${GITHUB_WORKSPACE}/patches/rgb_underglow.c" \
             "${{ env.base_dir }}/zmk/app/src/rgb_underglow.c"

          grep -q "UNDERGLOW_EFFECT_COLUMN_RAINBOW" \
              "${{ env.base_dir }}/zmk/app/src/rgb_underglow.c"
          grep -q "UNDERGLOW_EFFECT_MATRIX" \
              "${{ env.base_dir }}/zmk/app/src/rgb_underglow.c"

          echo "RGB16 patch verification passed."

      - name: Apply SAADC, SPIM3 and WS2812 idle-power fixes
        shell: sh -e {0}
        run: |
          set -eu
          zephyr_dir="${{ env.base_dir }}/zephyr"
          hal_nordic_dir="${{ env.base_dir }}/modules/hal/nordic"
          widget_module="${{ env.base_dir }}/zmk-ws2812-driver"
          saadc_file="$zephyr_dir/drivers/adc/adc_nrfx_saadc.c"
          spim_file="$hal_nordic_dir/nrfx/drivers/src/nrfx_spim.c"
          widget_file="$widget_module/src/widget.c"

          test -f "${GITHUB_WORKSPACE}/patches/patch_firmware_power.py"
          test -f "$saadc_file"
          test -f "$spim_file"
          test -f "$widget_file"

          # Reset cached dependency sources before applying deterministic patches.
          git -C "$zephyr_dir" restore --source=HEAD -- drivers/adc/adc_nrfx_saadc.c
          git -C "$hal_nordic_dir" restore --source=HEAD -- nrfx/drivers/src/nrfx_spim.c
          git -C "$widget_module" restore --source=HEAD -- src/widget.c
          rm -f "$saadc_file.before_power_patch.bak" \
                "$spim_file.before_power_patch.bak" \
                "$widget_file.before_power_patch.bak"

          python3 "${GITHUB_WORKSPACE}/patches/patch_firmware_power.py" \
            "$saadc_file" "$spim_file" "$widget_file"

          grep -Fq 'ZMK_SAADC_LOW_POWER_STOP_SEQUENCE_V1' "$saadc_file"
          grep -Fq 'ZMK_SPIM3_ANOMALY_195_AFTER_EACH_DISABLE_V1' "$spim_file"
          grep -Fq 'ZMK_WS2812_IDLE_EXT_POWER_PATCH_V2' "$widget_file"
          grep -Fq 'ws2812_idle_ext_power_prepare_wake' "$widget_file"
          grep -Fq 'ws2812_ext_power_disable_if_unused' "$widget_file"
          echo "SAADC, SPIM3 Anomaly 195 and WS2812 idle-power V2 fixes verified."

      - name: West Zephyr export
        working-directory: ${{ env.base_dir }}
        run: west zephyr-export

      - name: West Build (${{ env.display_name }})
        working-directory: ${{ env.base_dir }}
        shell: sh -x {0}
        run: |
          west build -s zmk/app \
            -d "${{ env.build_dir }}" \
            -b "${{ matrix.board }}" \
            ${{ env.extra_west_args }} -- \
            -DZMK_CONFIG=${{ env.base_dir }}/config \
            ${{ env.extra_cmake_args }} \
            ${{ matrix.cmake-args }}

      - name: Verify QDEC per-sample FIFO fix on left
        if: ${{ !cancelled() && contains(matrix.shield, 'eyelash_corne_left') }}
        shell: sh -e {0}
        run: |
          set -eu
          driver_file="${{ env.base_dir }}/zephyr/drivers/sensor/qdec_nrfx/qdec_nrfx.c"
          zmk_sensors="${{ env.base_dir }}/zmk/app/src/sensors.c"

          grep -Fq 'QDEC_SAMPLE_FIFO_PATCH_V1' "$driver_file"
          grep -Fq 'data->tick_queue[data->tick_tail]' "$driver_file"
          grep -Fq '.sample_inten = true,' "$driver_file"
          grep -Fq '.reportper_inten = false,' "$driver_file"
          grep -Fq 'ZMK_SENSOR_TRIGGER_FIFO_PATCH_V1' "$zmk_sensors"
          grep -Fq 'while (k_msgq_get(&pending_sensor_indices, &sensor_index, K_NO_WAIT) == 0)' "$zmk_sensors"

          if grep -Fq 'val->val1 = 0;' "$driver_file" && grep -Fq 'val->val2 = acc;' "$driver_file"; then
            echo "ERROR: obsolete raw-tick experiment is still present." >&2
            exit 1
          fi

          echo "Left-half QDEC sample FIFO and ZMK notification FIFO verified."

      - name: Verify QDEC is not compiled on right
        if: ${{ !cancelled() && contains(matrix.shield, 'eyelash_corne_right') }}
        shell: sh -e {0}
        run: |
          set -eu
          config_file="${{ env.build_dir }}/zephyr/.config"
          test -f "$config_file"

          if grep -Fqx 'CONFIG_QDEC_NRFX=y' "$config_file"; then
            echo "ERROR: QDEC is enabled in the right-half build." >&2
            exit 1
          fi

          echo "Right-half QDEC is disabled as expected."

      - name: ${{ env.display_name }} Kconfig file
        if: ${{ !cancelled() }}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/.config" ]; then
            grep -v -e "^#" -e "^$" "${{ env.build_dir }}/zephyr/.config" | sort
          else
            echo "No Kconfig output"
          fi

      - name: ${{ env.display_name }} Devicetree file
        if: ${{ !cancelled() }}
        run: |
          if [ -f "${{ env.build_dir }}/zephyr/zephyr.dts" ]; then
            cat "${{ env.build_dir }}/zephyr/zephyr.dts"
          elif [ -f "${{ env.build_dir }}/zephyr/zephyr.dts.pre" ]; then
            cat -s "${{ env.build_dir }}/zephyr/zephyr.dts.pre"
          else
            echo "No Devicetree output"
          fi

      - name: Rename artifacts
        shell: sh -x {0}
        run: |
          mkdir -p "${{ env.build_dir }}/artifacts"
          if [ -f "${{ env.build_dir }}/zephyr/zmk.uf2" ]; then
            cp "${{ env.build_dir }}/zephyr/zmk.uf2" \
               "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.uf2"
          elif [ -f "${{ env.build_dir }}/zephyr/zmk.bin" ]; then
            cp "${{ env.build_dir }}/zephyr/zmk.bin" \
               "${{ env.build_dir }}/artifacts/${{ env.artifact_name }}.bin"
          fi

      - name: Archive (${{ env.display_name }})
        uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ env.artifact_name }}
          path: ${{ env.build_dir }}/artifacts

  merge:
    runs-on: ubuntu-latest
    needs: build
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
